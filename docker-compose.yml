services:
  api:
    build:
      context: ./backend
      args:
        # 実 API / Firestore / GCS を使うときは true（google-adk などを追加インストール）
        WITH_LIVE_DEPS: ${WITH_LIVE_DEPS:-false}
    image: omoide-kobo-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      # mock | live  … 外部APIの実接続切替（キーが入るまでは mock）
      GEMINI_MODE: ${GEMINI_MODE:-mock}
      EKISPERT_MODE: ${EKISPERT_MODE:-mock}
      # firestore（既定・下の emulator を指す） | memory（テスト用）
      DB_DRIVER: ${DB_DRIVER:-firestore}
      FIRESTORE_EMULATOR_HOST: firestore:8085
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-omoide-kobo-local}
      # local | gcs
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /data/storage
      GCS_BUCKET: ${GCS_BUCKET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      EKISPERT_API_KEY: ${EKISPERT_API_KEY:-}
      EKISPERT_MCP_URL: ${EKISPERT_MCP_URL:-https://api-mcp.ekispert.jp/mcp}
      EKISPERT_SEARCH_TYPE: ${EKISPERT_SEARCH_TYPE:-plain}
    volumes:
      - ./backend:/app
      - omoide-data:/data
    depends_on:
      firestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
    image: omoide-kobo-web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: /api
      API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api
    networks:
      default:
        aliases:
          # 画面の写しに出る共有リンクの見た目を整えるための別名。
          # `web:5173` のままだと、案内ページに compose の内側の名前が載ってしまう。
          - omoide-kobo.local

  # 依存ロックの再生成（`docker compose run --rm lock`）。
  # requirements*.txt を編集したら必ず流し、requirements-lock.txt を更新する。
  lock:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["tools"]
    working_dir: /w
    volumes:
      - ./backend:/w
    command: >
      uv pip compile requirements.txt requirements-live.txt
      --python-platform x86_64-manylinux2014 --python-version 3.12
      --custom-compile-command "docker compose run --rm lock"
      -o requirements-lock.txt

  # アーキテクチャ図の生成（`docker compose --profile docs run --rm docs`）
  docs:
    build:
      context: ./docs
    image: omoide-kobo-docs
    profiles: ["docs"]
    volumes:
      - ./docs:/docs

  # 案内ページの「使い方」の写しを撮る
  # （`docker compose --profile shots up --build shots`）。
  # 画面を変えたら撮り直すだけで追随する。家族のデータを消してから撮ることに注意。
  shots:
    profiles: ["shots"]
    build:
      context: ./docs
      dockerfile: Dockerfile.shots
    image: omoide-kobo-shots
    user: root
    working_dir: /work
    environment:
      WEB_URL: http://omoide-kobo.local:5173
      API_URL: /api
      OUT_DIR: /work/frontend/public/guide
      NODE_PATH: /usr/src/app/node_modules
      TZ: Asia/Tokyo
    entrypoint: ["node", "docs/shots.js"]
    volumes:
      - .:/work
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  firestore:
    image: google/cloud-sdk:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8085
      --project=${GOOGLE_CLOUD_PROJECT:-omoide-kobo-local}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  omoide-data:
  web-node-modules:
